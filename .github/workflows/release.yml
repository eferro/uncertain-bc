name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make local-setup
      - run: make validate
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  install-check:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install with install.sh
        env:
          UBC_VERSION: ${{ github.ref_name }}
        run: |
          UBC_INSTALL_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/ubc" --version | grep -F "ubc ${UBC_VERSION#v}"
          test "$("$RUNNER_TEMP/bin/ubc" -e '1 + 2')" = 3

  install-check-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install with install.ps1
        shell: pwsh
        env:
          UBC_VERSION: ${{ github.ref_name }}
        run: |
          $env:UBC_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'ubc'
          ./install.ps1
          $version = & (Join-Path $env:UBC_INSTALL_DIR 'ubc.exe') --version
          if ($version -ne "ubc $($env:UBC_VERSION.TrimStart('v'))") { throw "unexpected version: $version" }

  go-install-check:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Install with go install
        env:
          GOPROXY: direct
          TAG: ${{ github.ref_name }}
        run: |
          go install "github.com/eferro/uncertain-bc/cmd/ubc@$TAG"
          "$(go env GOPATH)/bin/ubc" --version | grep -F "ubc ${TAG#v}"

  linux-package-install-check:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:latest
            pattern: "*_amd64.deb"
            install: dpkg -i
          - image: fedora:latest
            pattern: "*.x86_64.rpm"
            install: dnf install -y
          - image: alpine:latest
            pattern: "*_x86_64.apk"
            install: apk add --allow-untrusted
    runs-on: ubuntu-latest
    steps:
      - name: Install the package in ${{ matrix.image }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ matrix.image }}
          PATTERN: ${{ matrix.pattern }}
          INSTALL: ${{ matrix.install }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$PATTERN" --dir pkg
          docker run --rm -e TAG -e INSTALL -v "$PWD/pkg:/pkg:ro" "$IMAGE" \
            sh -c '$INSTALL /pkg/* && ubc --version | grep -F "ubc ${TAG#v}"'

  brew-install-check:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install with Homebrew
        env:
          PUBLISHED: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$PUBLISHED" != "true" ]; then echo "TAP_GITHUB_TOKEN is not set, nothing was published"; exit 0; fi
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv 2>/dev/null || /opt/homebrew/bin/brew shellenv)"
          brew install eferro/tap/ubc
          ubc --version | grep -F "ubc ${TAG#v}"

  scoop-install-check:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Install with Scoop
        shell: pwsh
        env:
          PUBLISHED: ${{ secrets.TAP_GITHUB_TOKEN != '' }}
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:PUBLISHED -ne 'true') { Write-Host 'TAP_GITHUB_TOKEN is not set, nothing was published'; exit 0 }
          Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
          scoop bucket add eferro https://github.com/eferro/scoop-bucket
          scoop install ubc
          $version = ubc --version
          if ($version -ne "ubc $($env:TAG.TrimStart('v'))") { throw "unexpected version: $version" }
