name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check commit messages
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE" ]]; then range="$BASE..HEAD"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then range="HEAD"
          else range="$BEFORE..HEAD"; fi
          scripts/checks/commit-messages.sh "$range"
      - run: make local-setup
      - run: make secrets-scan
      - run: make validate
      - run: make check-scripts
      - run: make build
      - run: make release-check

  test-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run the whole test suite on arm64, where math.Exp and math.Log differ from amd64 (ADR 0069)
        run: make test

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run the whole test suite, Windows console included (ADR 0037, ADR 0041)
        shell: bash
        run: make test
