# goreleaser v2 (ADR 0015). Check with `make release-check`, try with `make release-snapshot`.
version: 2

project_name: uncertain-bc

builds:
  - id: ubc
    main: ./cmd/ubc
    binary: ubc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - name_template: "ubc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: packages
    package_name: ubc
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Eduardo Ferro
    maintainer: Eduardo Ferro <eferro@eferro.net>
    homepage: https://github.com/eferro/uncertain-bc
    description: bc for numbers you are not sure about, a Monte Carlo calculator for ranges.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/ubc/LICENSE
      - src: README.md
        dst: /usr/share/doc/ubc/README.md

homebrew_casks:
  - name: ubc
    repository:
      owner: eferro
      name: homebrew-tap
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ end }}'
    homepage: https://github.com/eferro/uncertain-bc
    description: bc for numbers you are not sure about, a Monte Carlo calculator for ranges.
    license: MIT
    binaries: [ubc]
    generate_completions_from_executable:
      executable: ubc
      args: ["--completion"]
    commit_author:
      name: Eduardo Ferro
      email: eferro@eferro.net
    hooks:
      post:
        # The binaries are not notarised (ADR 0026); clear the quarantine flag
        # so Gatekeeper lets the cask run them.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/ubc"]
          end

scoops:
  - name: ubc
    repository:
      owner: eferro
      name: scoop-bucket
      token: '{{ envOrDefault "TAP_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if eq (envOrDefault "TAP_GITHUB_TOKEN" "") "" }}true{{ end }}'
    homepage: https://github.com/eferro/uncertain-bc
    description: bc for numbers you are not sure about, a Monte Carlo calculator for ranges.
    license: MIT
    commit_author:
      name: Eduardo Ferro
      email: eferro@eferro.net

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
      - "^ci"
