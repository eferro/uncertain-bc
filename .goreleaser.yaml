# goreleaser v2 (ADR 0015). Check with `make release-check`, try with `make release-snapshot`.
version: 2

project_name: uncertain-bc

builds:
  - id: ubc
    main: ./cmd/ubc
    binary: ubc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - name_template: "ubc_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: packages
    package_name: ubc
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: Eduardo Ferro
    maintainer: Eduardo Ferro <eferro@eferro.net>
    homepage: https://github.com/eferro/uncertain-bc
    description: bc for numbers you are not sure about, a Monte Carlo calculator for ranges.
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/ubc/LICENSE
      - src: README.md
        dst: /usr/share/doc/ubc/README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"
      - "^ci"
